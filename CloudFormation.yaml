AWSTemplateFormatVersion: '2010-09-09'
Description: 'AI Career Coach - IAM-protected application, course ingestion and scheduled knowledge refresh'

Parameters:
  FoundationModelId:
    Type: String
    Default: 'amazon.nova-lite-v1:0'
    Description: In-region generation model for Knowledge Base (verify availability before deployment)
    AllowedValues:
      - 'amazon.nova-lite-v1:0'
      - 'anthropic.claude-sonnet-4-5-20250929-v1:0'
      - 'anthropic.claude-haiku-4-5-20251001-v1:0'
  KnowledgeBaseId:
    Type: String
    Default: 'UPDATE_AFTER_KB_CREATION'
    Description: Set after Knowledge Base creation and before Sync to scope the ingestion invoke permission

  KnowledgeBaseDataSourceId:
    Type: String
    Default: NOT_CONFIGURED
    AllowedPattern: 'NOT_CONFIGURED|[A-Za-z0-9]{10}'
    Description: Bind after KB/source creation to provision the Scheduler resources in this stack
  SyncScheduleState:
    Type: String
    Default: DISABLED
    AllowedValues: [ENABLED, DISABLED]
  SyncScheduleExpression:
    Type: String
    Default: 'cron(0 3 ? * SUN *)'
    Description: EventBridge Scheduler cron or rate expression (weekly Sunday 03:00 by default)
  SyncScheduleTimezone:
    Type: String
    Default: Africa/Cairo
    Description: IANA timezone used by the schedule

  IngestionCodeS3Key:
    Type: String
    Description: Versioned ingestion ZIP key under lambda-artifacts/ in the existing stack bucket
  IngestionCodeS3ObjectVersion:
    Type: String
    Description: Exact S3 object version returned when uploading the ingestion ZIP

Conditions:
  HasSyncBinding: !And
    - !Not [!Equals [!Ref KnowledgeBaseId, UPDATE_AFTER_KB_CREATION]]
    - !Not [!Equals [!Ref KnowledgeBaseDataSourceId, NOT_CONFIGURED]]

Resources:
  # S3 Bucket for Knowledge Base Documents
  KnowledgeBaseDataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${AWS::StackName}-kb-data-${AWS::AccountId}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Application
          Value: AI-Career-Coach

  # DynamoDB Table for Career Plans
  CareerPlansTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-career-plans'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
        - AttributeName: timestamp
          KeyType: RANGE
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      Tags:
        - Key: Application
          Value: AI-Career-Coach

  # Lambda Execution Role
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-lambda-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: BedrockAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource: !Sub 'arn:aws:bedrock:${AWS::Region}::foundation-model/${FoundationModelId}'
              - Effect: Allow
                Action:
                  - bedrock:Retrieve
                Resource: !Sub 'arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/${KnowledgeBaseId}'
              # RetrieveAndGenerate does not support resource-level IAM scoping.
              - Effect: Allow
                Action:
                  - bedrock:RetrieveAndGenerate
                Resource: '*'
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                Resource: !GetAtt CareerPlansTable.Arn

  # Lambda Function (KB ID is bound through a stack update after KB creation)
  CareerCoachFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-handler'
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 60
      MemorySize: 512
      Environment:
        Variables:
          KNOWLEDGE_BASE_ID: !Ref KnowledgeBaseId
          DYNAMODB_TABLE: !Ref CareerPlansTable
          MODEL_ARN: !Sub 'arn:aws:bedrock:${AWS::Region}::foundation-model/${FoundationModelId}'
      Code:
        ZipFile: |
          import json
          import boto3
          import os
          from datetime import datetime
          import uuid

          bedrock_agent = boto3.client('bedrock-agent-runtime')
          dynamodb = boto3.resource('dynamodb')
          table = dynamodb.Table(os.environ['DYNAMODB_TABLE'])

          def lambda_handler(event, context):
              try:
                  # Parse input
                  body = json.loads(event.get('body', '{}'))
                  current_role = body.get('current_role', '')
                  goal = body.get('goal', '')
                  user_id = body.get('user_id', str(uuid.uuid4()))
                  
                  if not current_role or not goal:
                      return {
                          'statusCode': 400,
                          'headers': {'Content-Type': 'application/json'},
                          'body': json.dumps({'error': 'current_role and goal are required'})
                      }
                  
                  # Create prompt
                  prompt = f"""You are an expert career coach. Create a personalized career development plan.

          Current Role: {current_role}
          Career Goal: {goal}

          Provide a comprehensive career development plan that includes:
          1. Recommended internal training courses (from the knowledge base)
          2. Key skills to develop
          3. Suggested timeline (3-6 months)
          4. Additional certifications or learning resources

          Be specific and actionable."""

                  # Call Bedrock Knowledge Base
                  kb_id = os.environ.get('KNOWLEDGE_BASE_ID')
                  
                  if not kb_id or kb_id == 'UPDATE_AFTER_KB_CREATION':
                      return {
                          'statusCode': 500,
                          'headers': {'Content-Type': 'application/json'},
                          'body': json.dumps({
                              'error': 'Knowledge Base ID not configured. Please update Lambda environment variable.'
                          })
                      }
                  
                  # Try with retrieval configuration
                  response = bedrock_agent.retrieve_and_generate(
                      input={'text': prompt},
                      retrieveAndGenerateConfiguration={
                          'type': 'KNOWLEDGE_BASE',
                          'knowledgeBaseConfiguration': {
                              'knowledgeBaseId': kb_id,
                              'modelArn': os.environ['MODEL_ARN'],
                              'generationConfiguration': {
                                  'inferenceConfig': {
                                      'textInferenceConfig': {
                                          'maxTokens': 800
                                      }
                                  }
                              },
                              'retrievalConfiguration': {
                                  'vectorSearchConfiguration': {
                                      'numberOfResults': 5
                                  }
                              }
                          }
                      }
                  )
                  
                  # Extract response
                  generated_text = response['output']['text']
                  citations = response.get('citations', [])
                  
                  # Save to DynamoDB
                  timestamp = datetime.utcnow().isoformat()
                  table.put_item(Item={
                      'user_id': user_id,
                      'timestamp': timestamp,
                      'current_role': current_role,
                      'goal': goal,
                      'career_plan': generated_text,
                      'citations': citations
                  })
                  
                  return {
                      'statusCode': 200,
                      'headers': {
                          'Content-Type': 'application/json',
                          'Access-Control-Allow-Origin': '*'
                      },
                      'body': json.dumps({
                          'user_id': user_id,
                          'current_role': current_role,
                          'goal': goal,
                          'career_plan': generated_text,
                          'citations': citations,
                          'timestamp': timestamp
                      }, indent=2)
                  }
                  
              except Exception as e:
                  print(f"Error: {str(e)}")
                  import traceback
                  print(traceback.format_exc())
                  return {
                      'statusCode': 500,
                      'headers': {'Content-Type': 'application/json'},
                      'body': json.dumps({'error': str(e)})
                  }

  # Custom chunking hook: invoked by Bedrock during Sync, never by the public API.
  # Bedrock requires transformation intermediate storage in a different bucket from the source.
  IngestionIntermediateBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${AWS::StackName}-kb-intermediate-${AWS::AccountId}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Application
          Value: AI-Career-Coach

  IngestionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-ingestion-transform'
      RetentionInDays: 7

  IngestionLambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-ingestion-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: IntermediateS3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub '${IngestionIntermediateBucket.Arn}/kb-intermediate/*'
        - PolicyName: IngestionLogWrites
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-ingestion-transform:*'

  IngestionTransformationFunction:
    Type: AWS::Lambda::Function
    DependsOn: IngestionLogGroup
    Properties:
      FunctionName: !Sub '${AWS::StackName}-ingestion-transform'
      Runtime: python3.12
      Architectures:
        - x86_64
      Handler: ingestion.transform.lambda_handler
      Role: !GetAtt IngestionLambdaExecutionRole.Arn
      MemorySize: 256
      Timeout: 60
      Environment:
        Variables:
          INTERMEDIATE_BUCKET: !Ref IngestionIntermediateBucket
          INTERMEDIATE_PREFIX: kb-intermediate/
          CATALOG_SOURCE_URI: !Sub 's3://${KnowledgeBaseDataBucket}/internal_courses.md'
      Code:
        S3Bucket: !Ref KnowledgeBaseDataBucket
        S3Key: !Ref IngestionCodeS3Key
        S3ObjectVersion: !Ref IngestionCodeS3ObjectVersion

  # Bedrock service-to-Lambda permission is separate from the KB role's identity policy.
  IngestionBedrockPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref IngestionTransformationFunction
      Action: lambda:InvokeFunction
      Principal: bedrock.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/${KnowledgeBaseId}'

  # API Gateway
  CareerCoachAPI:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${AWS::StackName}-api'
      ProtocolType: HTTP
      Description: API for AI Career Coach
      CorsConfiguration:
        AllowOrigins:
          - '*'
        AllowMethods:
          - POST
          - GET
          - OPTIONS
        AllowHeaders:
          - '*'

  ApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref CareerCoachAPI
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt CareerCoachFunction.Arn
      PayloadFormatVersion: '2.0'
      TimeoutInMillis: 30000

  ApiRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref CareerCoachAPI
      RouteKey: 'POST /generate-plan'
      AuthorizationType: AWS_IAM
      Target: !Sub 'integrations/${ApiIntegration}'

  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref CareerCoachAPI
      StageName: prod
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 2
        ThrottlingRateLimit: 1

  # Lambda Permission for API Gateway
  LambdaApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref CareerCoachFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${CareerCoachAPI}/prod/POST/generate-plan'

  # First-time setup is handled by ingestion.setup_lab; these resources run subsequent Sync jobs.
  WeeklySyncGroup:
    Type: AWS::Scheduler::ScheduleGroup
    Condition: HasSyncBinding
  WeeklySyncDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 1209600
    Condition: HasSyncBinding
  WeeklySyncExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: scheduler.amazonaws.com
          Action: sts:AssumeRole
          Condition:
            StringEquals:
              aws:SourceAccount:
                Ref: AWS::AccountId
            ArnEquals:
              aws:SourceArn:
                Fn::GetAtt:
                - WeeklySyncGroup
                - Arn
      Policies:
      - PolicyName: StartThisDataSourceSync
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action: bedrock:StartIngestionJob
            Resource:
              Fn::Sub: arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/${KnowledgeBaseId}
          - Effect: Allow
            Action: sqs:SendMessage
            Resource:
              Fn::GetAtt:
              - WeeklySyncDeadLetterQueue
              - Arn
    Condition: HasSyncBinding
  WeeklyKnowledgeBaseSync:
    Type: AWS::Scheduler::Schedule
    Properties:
      GroupName:
        Ref: WeeklySyncGroup
      State:
        Ref: SyncScheduleState
      ScheduleExpression:
        Ref: SyncScheduleExpression
      ScheduleExpressionTimezone:
        Ref: SyncScheduleTimezone
      FlexibleTimeWindow:
        Mode: 'OFF'
      Target:
        Arn:
          Fn::Sub: arn:${AWS::Partition}:scheduler:::aws-sdk:bedrockagent:startIngestionJob
        RoleArn:
          Fn::GetAtt:
          - WeeklySyncExecutionRole
          - Arn
        Input:
          Fn::Sub: '{"knowledgeBaseId":"${KnowledgeBaseId}","dataSourceId":"${KnowledgeBaseDataSourceId}"}'
        RetryPolicy:
          MaximumEventAgeInSeconds: 3600
          MaximumRetryAttempts: 2
        DeadLetterConfig:
          Arn:
            Fn::GetAtt:
            - WeeklySyncDeadLetterQueue
            - Arn
    Condition: HasSyncBinding

Outputs:
  IngestionFunctionName:
    Description: Custom chunking function used only during Knowledge Base Sync
    Value: !Ref IngestionTransformationFunction
  IngestionFunctionArn:
    Description: Select this transformation ARN when creating the Knowledge Base data source
    Value: !GetAtt IngestionTransformationFunction.Arn
  IngestionExecutionRoleArn:
    Description: Ingestion runtime role (different from the Bedrock Knowledge Base service role)
    Value: !GetAtt IngestionLambdaExecutionRole.Arn
  IngestionLogGroupName:
    Description: Ingestion execution logs with seven-day retention
    Value: !Ref IngestionLogGroup
  IngestionIntermediateBucketName:
    Description: Dedicated intermediate bucket, distinct from the source bucket as required by Bedrock
    Value: !Ref IngestionIntermediateBucket
  IngestionIntermediateS3Uri:
    Description: Intermediate transformation storage; exclude it from source inclusion
    Value: !Sub 's3://${IngestionIntermediateBucket}/kb-intermediate/'

  S3BucketName:
    Description: S3 bucket for knowledge base documents (use this when creating KB)
    Value: !Ref KnowledgeBaseDataBucket
    Export:
      Name: !Sub '${AWS::StackName}-S3Bucket'

  S3BucketArn:
    Description: S3 bucket ARN (use this when creating KB data source)
    Value: !GetAtt KnowledgeBaseDataBucket.Arn

  LambdaFunctionName:
    Description: Lambda function name (update this after creating KB)
    Value: !Ref CareerCoachFunction
    Export:
      Name: !Sub '${AWS::StackName}-LambdaFunction'

  ApiEndpoint:
    Description: API Gateway endpoint URL (test this after updating Lambda)
    Value: !Sub 'https://${CareerCoachAPI}.execute-api.${AWS::Region}.amazonaws.com/prod/generate-plan'
    Export:
      Name: !Sub '${AWS::StackName}-ApiEndpoint'

  DynamoDBTable:
    Description: DynamoDB table for career plans
    Value: !Ref CareerPlansTable
    Export:
      Name: !Sub '${AWS::StackName}-DynamoDBTable'

  ApiInvokeArn:
    Description: Grant execute-api:Invoke on this ARN to the local caller's IAM identity
    Value: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${CareerCoachAPI}/prod/POST/generate-plan'

  NextSteps:
    Description: Deployment and acceptance entry points
    Value: |
      1. Use ingestion.setup_lab setup with an explicit profile/Region to preview; add --apply to provision/reconcile
      2. Setup uploads the catalog, creates/reuses the KB, binds its ID and hook permission, then creates/validates the source
      3. Setup verifies initial Sync and Retrieve; --enable-schedule binds weekly refresh in this stack
      4. Configure Flask with ApiEndpoint and caller execute-api:Invoke; validate generation, citations and DynamoDB persistence
  SyncScheduleName:
    Condition: HasSyncBinding
    Value:
      Ref: WeeklyKnowledgeBaseSync
  SyncScheduleGroup:
    Condition: HasSyncBinding
    Value:
      Ref: WeeklySyncGroup
  SyncDeadLetterQueueUrl:
    Condition: HasSyncBinding
    Value:
      Ref: WeeklySyncDeadLetterQueue
  SyncScheduleState:
    Condition: HasSyncBinding
    Value:
      Ref: SyncScheduleState
  SyncScheduleExpression:
    Condition: HasSyncBinding
    Value:
      Ref: SyncScheduleExpression
  SyncScheduleTimezone:
    Condition: HasSyncBinding
    Value:
      Ref: SyncScheduleTimezone
