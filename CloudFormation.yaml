AWSTemplateFormatVersion: '2010-09-09'
Description: 'AI Career Coach - IAM-protected application, course ingestion and scheduled knowledge refresh'

Parameters:
  ExistingSessionsTableName:
    Type: String
    Default: ''
    Description: Optional retained session table name after an explicitly reviewed resource import
  FoundationModelId:
    Type: String
    Default: 'amazon.nova-lite-v1:0'
    Description: In-region generation model for Knowledge Base (verify availability before deployment)
    AllowedValues:
      - 'amazon.nova-lite-v1:0'
      - 'anthropic.claude-sonnet-4-5-20250929-v1:0'
      - 'anthropic.claude-haiku-4-5-20251001-v1:0'
  IntakeModelId:
    Type: String
    Default: anthropic.claude-haiku-4-5-20251001-v1:0
    Description: Candidate model ID or full inference-profile ARN; verify runtime access before activation
  IntakeDestinationModelArns:
    Type: CommaDelimitedList
    Default: NOT_CONFIGURED
    Description: Exact foundation-model destination ARNs required by the selected inference profile
  PlannerModelId:
    Type: String
    Default: anthropic.claude-haiku-4-5-20251001-v1:0
    Description: Planner candidate model ID or full inference-profile ARN
  PlannerDestinationModelArns:
    Type: CommaDelimitedList
    Default: NOT_CONFIGURED
    Description: Exact foundation-model ARNs for every selected profile destination Region
  SerperSecretArn:
    Type: String
    Default: NOT_CONFIGURED
    AllowedPattern: 'NOT_CONFIGURED|arn:aws:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:[A-Za-z0-9/_+=.@-]+'
    Description: Existing Serper secret ARN only; never pass plaintext key material
  GuidedEnabled:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Explicitly enable guided routes and consumers only after authorized acceptance
  KnowledgeBaseId:
    Type: String
    Default: 'UPDATE_AFTER_KB_CREATION'
    Description: Set after Knowledge Base creation and before Sync to scope the ingestion invoke permission

  KnowledgeBaseDataSourceId:
    Type: String
    Default: NOT_CONFIGURED
    AllowedPattern: 'NOT_CONFIGURED|[A-Za-z0-9]{10}'
    Description: Bind after KB/source creation to provision the Scheduler resources in this stack
  SyncScheduleState:
    Type: String
    Default: DISABLED
    AllowedValues: [ENABLED, DISABLED]
  SyncScheduleExpression:
    Type: String
    Default: 'cron(0 3 ? * SUN *)'
    Description: EventBridge Scheduler cron or rate expression (weekly Sunday 03:00 by default)
  SyncScheduleTimezone:
    Type: String
    Default: Africa/Cairo
    Description: IANA timezone used by the schedule

  ApplicationCodeS3Key:
    Type: String
    Description: Content-addressed application ZIP key under lambda-artifacts/
  ApplicationCodeS3ObjectVersion:
    Type: String
    Description: Exact uploaded application ZIP object version
  WorkerCodeS3Key:
    Type: String
    Description: Independent content-addressed worker ZIP key under lambda-artifacts/worker/
  WorkerCodeS3ObjectVersion:
    Type: String
    Description: Exact uploaded worker ZIP object version

  IngestionCodeS3Key:
    Type: String
    Description: Versioned ingestion ZIP key under lambda-artifacts/ in the existing stack bucket
  IngestionCodeS3ObjectVersion:
    Type: String
    Description: Exact S3 object version returned when uploading the ingestion ZIP

Conditions:
  HasExistingSessionsTable: !Not [!Equals [!Ref ExistingSessionsTableName, '']]
  EnableGuided: !Equals [!Ref GuidedEnabled, 'true']
  PlannerIsArn: !Equals [!Select [0, !Split [':', !Ref PlannerModelId]], arn]
  HasPlannerDestinations: !Not [!Equals [!Join [',', !Ref PlannerDestinationModelArns], NOT_CONFIGURED]]
  HasSerperSecret: !Not [!Equals [!Ref SerperSecretArn, NOT_CONFIGURED]]
  IntakeIsArn: !Equals [!Select [0, !Split [':', !Ref IntakeModelId]], arn]
  HasIntakeDestinations: !Not [!Equals [!Join [',', !Ref IntakeDestinationModelArns], NOT_CONFIGURED]]
  HasSyncBinding: !And
    - !Not [!Equals [!Ref KnowledgeBaseId, UPDATE_AFTER_KB_CREATION]]
    - !Not [!Equals [!Ref KnowledgeBaseDataSourceId, NOT_CONFIGURED]]

Resources:
  # S3 Bucket for Knowledge Base Documents
  KnowledgeBaseDataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${AWS::StackName}-kb-data-${AWS::AccountId}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Application
          Value: AI-Career-Coach

  SessionsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !If [HasExistingSessionsTable, !Ref ExistingSessionsTableName, !Ref AWS::NoValue]
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      StreamSpecification:
        StreamViewType: NEW_IMAGE

  # DynamoDB Table for Career Plans
  CareerPlansTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-career-plans'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
        - AttributeName: timestamp
          KeyType: RANGE
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      Tags:
        - Key: Application
          Value: AI-Career-Coach

  # Lambda Execution Role
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-lambda-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: BedrockAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource: !Sub 'arn:aws:bedrock:${AWS::Region}::foundation-model/${FoundationModelId}'
              - Effect: Allow
                Action:
                  - bedrock:Retrieve
                Resource: !Sub 'arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/${KnowledgeBaseId}'
              # RetrieveAndGenerate does not support resource-level IAM scoping.
              - Effect: Allow
                Action:
                  - bedrock:RetrieveAndGenerate
                Resource: '*'
        - PolicyName: IntakeModelAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: bedrock:InvokeModel
                Resource: !If [IntakeIsArn, !Ref IntakeModelId, !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${IntakeModelId}']
              - Effect: Allow
                Action: bedrock:InvokeModel
                Resource: !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:project/default'
              - !If
                - HasIntakeDestinations
                - Effect: Allow
                  Action: bedrock:InvokeModel
                  Resource: !Ref IntakeDestinationModelArns
                - !Ref AWS::NoValue
        - PolicyName: SessionStateAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem]
                Resource: !GetAtt SessionsTable.Arn
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                Resource: !GetAtt CareerPlansTable.Arn
        - PolicyName: DispatchJobs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt GenerationQueue.Arn
              - Effect: Allow
                Action: [dynamodb:DescribeStream, dynamodb:GetRecords, dynamodb:GetShardIterator]
                Resource: !GetAtt SessionsTable.StreamArn
              - Effect: Allow
                Action: dynamodb:ListStreams
                # ListStreams is a list action without a resource type in SAR.
                Resource: '*'
                Condition:
                  StringEquals:
                    aws:RequestedRegion: !Ref AWS::Region

  # Lambda Function (KB ID is bound through a stack update after KB creation)
  CareerCoachFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-handler'
      Runtime: python3.12
      Handler: career_coach.handler.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 60
      MemorySize: 512
      Environment:
        Variables:
          KNOWLEDGE_BASE_ID: !Ref KnowledgeBaseId
          DYNAMODB_TABLE: !Ref CareerPlansTable
          SESSIONS_TABLE: !Ref SessionsTable
          INTAKE_MODEL_ID: !Ref IntakeModelId
          GENERATION_QUEUE_URL: !Ref GenerationQueue
          MODEL_ARN: !Sub 'arn:aws:bedrock:${AWS::Region}::foundation-model/${FoundationModelId}'
      Code:
        S3Bucket: !Ref KnowledgeBaseDataBucket
        S3Key: !Ref ApplicationCodeS3Key
        S3ObjectVersion: !Ref ApplicationCodeS3ObjectVersion

  GenerationDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 1209600
  GenerationQueue:
    Type: AWS::SQS::Queue
    Properties:
      SqsManagedSseEnabled: true
      VisibilityTimeout: 1080
      MessageRetentionPeriod: 604800
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt GenerationDeadLetterQueue.Arn
        maxReceiveCount: 5
  GenerationQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref GenerationQueue]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Deny
            Principal: '*'
            Action: sqs:*
            Resource: !GetAtt GenerationQueue.Arn
            Condition:
              Bool:
                aws:SecureTransport: 'false'
  GenerationDeadLetterQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref GenerationDeadLetterQueue]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Deny
            Principal: '*'
            Action: sqs:*
            Resource: !GetAtt GenerationDeadLetterQueue.Arn
            Condition:
              Bool:
                aws:SecureTransport: 'false'
  GenerationWorkerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: WorkerRuntime
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-generation-worker:*'
              - Effect: Allow
                Action: [sqs:ReceiveMessage, sqs:DeleteMessage, sqs:GetQueueAttributes, sqs:ChangeMessageVisibility]
                Resource: !GetAtt GenerationQueue.Arn
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem]
                Resource: [!GetAtt SessionsTable.Arn, !GetAtt CareerPlansTable.Arn]
              - Effect: Allow
                Action: dynamodb:ConditionCheckItem
                Resource: !GetAtt SessionsTable.Arn
              - Effect: Allow
                Action: bedrock:Retrieve
                Resource: !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/${KnowledgeBaseId}'
              - Effect: Allow
                Action: bedrock:InvokeModel
                Resource: !If [PlannerIsArn, !Ref PlannerModelId, !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${PlannerModelId}']
              - Effect: Allow
                Action: bedrock:InvokeModel
                Resource: !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:project/default'
              - !If
                - HasPlannerDestinations
                - Effect: Allow
                  Action: bedrock:InvokeModel
                  Resource: !Ref PlannerDestinationModelArns
                - !Ref AWS::NoValue
              - !If
                - HasSerperSecret
                - Effect: Allow
                  Action: secretsmanager:GetSecretValue
                  Resource: !Ref SerperSecretArn
                - !Ref AWS::NoValue
  GenerationWorkerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-generation-worker'
      RetentionInDays: 7
  GenerationWorkerFunction:
    Type: AWS::Lambda::Function
    DependsOn: GenerationWorkerLogGroup
    Properties:
      FunctionName: !Sub '${AWS::StackName}-generation-worker'
      Runtime: python3.12
      Handler: career_coach.worker.lambda_handler
      Architectures: [x86_64]
      Role: !GetAtt GenerationWorkerRole.Arn
      Timeout: 180
      MemorySize: 512
      Environment:
        Variables:
          SESSIONS_TABLE: !Ref SessionsTable
          DYNAMODB_TABLE: !Ref CareerPlansTable
          KNOWLEDGE_BASE_ID: !Ref KnowledgeBaseId
          GENERATION_QUEUE_URL: !Ref GenerationQueue
          PLANNER_MODEL_ID: !Ref PlannerModelId
          SERPER_SECRET_ARN: !Ref SerperSecretArn
      Code:
        S3Bucket: !Ref KnowledgeBaseDataBucket
        S3Key: !Ref WorkerCodeS3Key
        S3ObjectVersion: !Ref WorkerCodeS3ObjectVersion
  GenerationQueueMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt GenerationQueue.Arn
      FunctionName: !Ref GenerationWorkerFunction
      Enabled: !If [EnableGuided, true, false]
      BatchSize: 1
      MaximumBatchingWindowInSeconds: 0
      FunctionResponseTypes: [ReportBatchItemFailures]
      ScalingConfig:
        MaximumConcurrency: 2
  DispatchOutboxMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt SessionsTable.StreamArn
      FunctionName: !Ref CareerCoachFunction
      Enabled: !If [EnableGuided, true, false]
      StartingPosition: TRIM_HORIZON
      BatchSize: 1
      MaximumBatchingWindowInSeconds: 0
      MaximumRetryAttempts: 2
      MaximumRecordAgeInSeconds: 3600
      BisectBatchOnFunctionError: true
      FunctionResponseTypes: [ReportBatchItemFailures]
      FilterCriteria:
        Filters:
          - Pattern: '{"eventName":["INSERT","MODIFY"],"dynamodb":{"NewImage":{"sk":{"S":[{"prefix":"JOB#"}]}}}}'

  # Custom chunking hook: invoked by Bedrock during Sync, never by the public API.
  # Bedrock requires transformation intermediate storage in a different bucket from the source.
  IngestionIntermediateBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${AWS::StackName}-kb-intermediate-${AWS::AccountId}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Application
          Value: AI-Career-Coach

  IngestionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-ingestion-transform'
      RetentionInDays: 7

  IngestionLambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-ingestion-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: IntermediateS3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub '${IngestionIntermediateBucket.Arn}/kb-intermediate/*'
        - PolicyName: IngestionLogWrites
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-ingestion-transform:*'

  IngestionTransformationFunction:
    Type: AWS::Lambda::Function
    DependsOn: IngestionLogGroup
    Properties:
      FunctionName: !Sub '${AWS::StackName}-ingestion-transform'
      Runtime: python3.12
      Architectures:
        - x86_64
      Handler: ingestion.transform.lambda_handler
      Role: !GetAtt IngestionLambdaExecutionRole.Arn
      MemorySize: 256
      Timeout: 60
      Environment:
        Variables:
          INTERMEDIATE_BUCKET: !Ref IngestionIntermediateBucket
          INTERMEDIATE_PREFIX: kb-intermediate/
          CATALOG_SOURCE_URI: !Sub 's3://${KnowledgeBaseDataBucket}/internal_courses.md'
      Code:
        S3Bucket: !Ref KnowledgeBaseDataBucket
        S3Key: !Ref IngestionCodeS3Key
        S3ObjectVersion: !Ref IngestionCodeS3ObjectVersion

  # Bedrock service-to-Lambda permission is separate from the KB role's identity policy.
  IngestionBedrockPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref IngestionTransformationFunction
      Action: lambda:InvokeFunction
      Principal: bedrock.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/${KnowledgeBaseId}'

  # API Gateway
  CareerCoachAPI:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${AWS::StackName}-api'
      ProtocolType: HTTP
      Description: API for AI Career Coach
      CorsConfiguration:
        AllowOrigins:
          - '*'
        AllowMethods:
          - POST
          - GET
          - OPTIONS
        AllowHeaders:
          - '*'

  ApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref CareerCoachAPI
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt CareerCoachFunction.Arn
      PayloadFormatVersion: '2.0'
      TimeoutInMillis: 30000

  ApiRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref CareerCoachAPI
      RouteKey: 'POST /generate-plan'
      AuthorizationType: AWS_IAM
      Target: !Sub 'integrations/${ApiIntegration}'

  SessionCreateRoute:
    Type: AWS::ApiGatewayV2::Route
    Condition: EnableGuided
    Properties:
      ApiId: !Ref CareerCoachAPI
      RouteKey: 'POST /v2/sessions'
      AuthorizationType: AWS_IAM
      Target: !Sub 'integrations/${ApiIntegration}'
  SessionProxyRoute:
    Type: AWS::ApiGatewayV2::Route
    Condition: EnableGuided
    Properties:
      ApiId: !Ref CareerCoachAPI
      RouteKey: 'ANY /v2/sessions/{proxy+}'
      AuthorizationType: AWS_IAM
      Target: !Sub 'integrations/${ApiIntegration}'
  V2LambdaApiPermission:
    Type: AWS::Lambda::Permission
    Condition: EnableGuided
    Properties:
      FunctionName: !Ref CareerCoachFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${CareerCoachAPI}/prod/*/v2/sessions*'

  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref CareerCoachAPI
      StageName: prod
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 2
        ThrottlingRateLimit: 1

  # Lambda Permission for API Gateway
  LambdaApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref CareerCoachFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${CareerCoachAPI}/prod/POST/generate-plan'

  # First-time setup is handled by ingestion.setup_lab; these resources run subsequent Sync jobs.
  WeeklySyncGroup:
    Type: AWS::Scheduler::ScheduleGroup
    Condition: HasSyncBinding
  WeeklySyncDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 1209600
    Condition: HasSyncBinding
  WeeklySyncExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: scheduler.amazonaws.com
          Action: sts:AssumeRole
          Condition:
            StringEquals:
              aws:SourceAccount:
                Ref: AWS::AccountId
            ArnEquals:
              aws:SourceArn:
                Fn::GetAtt:
                - WeeklySyncGroup
                - Arn
      Policies:
      - PolicyName: StartThisDataSourceSync
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action: bedrock:StartIngestionJob
            Resource:
              Fn::Sub: arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/${KnowledgeBaseId}
          - Effect: Allow
            Action: sqs:SendMessage
            Resource:
              Fn::GetAtt:
              - WeeklySyncDeadLetterQueue
              - Arn
    Condition: HasSyncBinding
  WeeklyKnowledgeBaseSync:
    Type: AWS::Scheduler::Schedule
    Properties:
      GroupName:
        Ref: WeeklySyncGroup
      State:
        Ref: SyncScheduleState
      ScheduleExpression:
        Ref: SyncScheduleExpression
      ScheduleExpressionTimezone:
        Ref: SyncScheduleTimezone
      FlexibleTimeWindow:
        Mode: 'OFF'
      Target:
        Arn:
          Fn::Sub: arn:${AWS::Partition}:scheduler:::aws-sdk:bedrockagent:startIngestionJob
        RoleArn:
          Fn::GetAtt:
          - WeeklySyncExecutionRole
          - Arn
        Input:
          Fn::Sub: '{"KnowledgeBaseId":"${KnowledgeBaseId}","DataSourceId":"${KnowledgeBaseDataSourceId}"}'
        RetryPolicy:
          MaximumEventAgeInSeconds: 3600
          MaximumRetryAttempts: 2
        DeadLetterConfig:
          Arn:
            Fn::GetAtt:
            - WeeklySyncDeadLetterQueue
            - Arn
    Condition: HasSyncBinding

Outputs:
  GenerationQueueUrl:
    Value: !Ref GenerationQueue
  GenerationDeadLetterQueueUrl:
    Value: !Ref GenerationDeadLetterQueue
  GenerationWorkerName:
    Value: !Ref GenerationWorkerFunction
  GenerationWorkerRoleArn:
    Value: !GetAtt GenerationWorkerRole.Arn
  GuidedEnabled:
    Value: !Ref GuidedEnabled
  SessionsTableName:
    Value: !Ref SessionsTable
  ApiBaseEndpoint:
    Value: !Sub 'https://${CareerCoachAPI}.execute-api.${AWS::Region}.amazonaws.com/prod'
  V2ApiInvokeArn:
    Description: Grant the Flask server identity execute-api Invoke on these signed session routes
    Value: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${CareerCoachAPI}/prod/*/v2/sessions*'
  IngestionFunctionName:
    Description: Custom chunking function used only during Knowledge Base Sync
    Value: !Ref IngestionTransformationFunction
  IngestionFunctionArn:
    Description: Select this transformation ARN when creating the Knowledge Base data source
    Value: !GetAtt IngestionTransformationFunction.Arn
  IngestionExecutionRoleArn:
    Description: Ingestion runtime role (different from the Bedrock Knowledge Base service role)
    Value: !GetAtt IngestionLambdaExecutionRole.Arn
  IngestionLogGroupName:
    Description: Ingestion execution logs with seven-day retention
    Value: !Ref IngestionLogGroup
  IngestionIntermediateBucketName:
    Description: Dedicated intermediate bucket, distinct from the source bucket as required by Bedrock
    Value: !Ref IngestionIntermediateBucket
  IngestionIntermediateS3Uri:
    Description: Intermediate transformation storage; exclude it from source inclusion
    Value: !Sub 's3://${IngestionIntermediateBucket}/kb-intermediate/'

  S3BucketName:
    Description: S3 bucket for knowledge base documents (use this when creating KB)
    Value: !Ref KnowledgeBaseDataBucket
    Export:
      Name: !Sub '${AWS::StackName}-S3Bucket'

  S3BucketArn:
    Description: S3 bucket ARN (use this when creating KB data source)
    Value: !GetAtt KnowledgeBaseDataBucket.Arn

  LambdaFunctionName:
    Description: Lambda function name (update this after creating KB)
    Value: !Ref CareerCoachFunction
    Export:
      Name: !Sub '${AWS::StackName}-LambdaFunction'

  ApiEndpoint:
    Description: API Gateway endpoint URL (test this after updating Lambda)
    Value: !Sub 'https://${CareerCoachAPI}.execute-api.${AWS::Region}.amazonaws.com/prod/generate-plan'
    Export:
      Name: !Sub '${AWS::StackName}-ApiEndpoint'

  DynamoDBTable:
    Description: DynamoDB table for career plans
    Value: !Ref CareerPlansTable
    Export:
      Name: !Sub '${AWS::StackName}-DynamoDBTable'

  ApiInvokeArn:
    Description: Grant execute-api:Invoke on this ARN to the local caller's IAM identity
    Value: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${CareerCoachAPI}/prod/POST/generate-plan'

  NextSteps:
    Description: Deployment and acceptance entry points
    Value: |
      1. Use ingestion.setup_lab setup with an explicit profile/Region to preview; add --apply to provision/reconcile
      2. Setup uploads the catalog, creates/reuses the KB, binds its ID and hook permission, then creates/validates the source
      3. Setup verifies initial Sync and Retrieve; --enable-schedule binds weekly refresh in this stack
      4. Configure Flask with ApiEndpoint and caller execute-api:Invoke; validate generation, citations and DynamoDB persistence
  SyncScheduleName:
